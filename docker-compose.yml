# Local development database only. Production uses a managed PostgreSQL instance.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nirna
      POSTGRES_DB: nirna
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nirna -d nirna']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
